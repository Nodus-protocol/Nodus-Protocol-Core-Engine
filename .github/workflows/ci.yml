name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Verify fee constants match smart contract
        run: |
          curl -sf https://raw.githubusercontent.com/Nodus-protocol/Nodus-Protocol-Smart-Contract/main/src/math.rs -o /tmp/sc_math.rs
          extract_value() {
            grep -E "^\s*pub const ${1}:" "$2" | sed -E 's/.*=\s*([0-9_]+)\s*;.*/\1/' | tr -d '_'
          }
          SC_FEE_NUM=$(extract_value FEE_NUMERATOR /tmp/sc_math.rs)
          SC_FEE_DEN=$(extract_value FEE_DENOMINATOR /tmp/sc_math.rs)
          SC_MIN_LIQ=$(extract_value MINIMUM_LIQUIDITY /tmp/sc_math.rs)
          CE_FEE_NUM=$(extract_value FEE_NUMERATOR src/pool/math.rs)
          CE_FEE_DEN=$(extract_value FEE_DENOMINATOR src/pool/math.rs)
          CE_MIN_LIQ=$(extract_value MINIMUM_LIQUIDITY src/pool/math.rs)
          echo "Smart Contract: FEE_NUMERATOR=$SC_FEE_NUM FEE_DENOMINATOR=$SC_FEE_DEN MINIMUM_LIQUIDITY=$SC_MIN_LIQ"
          echo "Core Engine:    FEE_NUMERATOR=$CE_FEE_NUM FEE_DENOMINATOR=$CE_FEE_DEN MINIMUM_LIQUIDITY=$CE_MIN_LIQ"
          FAIL=0
          if [ "$SC_FEE_NUM" != "$CE_FEE_NUM" ]; then
            echo "::error::FEE_NUMERATOR mismatch: SmartContract=$SC_FEE_NUM CoreEngine=$CE_FEE_NUM"
            FAIL=1
          fi
          if [ "$SC_FEE_DEN" != "$CE_FEE_DEN" ]; then
            echo "::error::FEE_DENOMINATOR mismatch: SmartContract=$SC_FEE_DEN CoreEngine=$CE_FEE_DEN"
            FAIL=1
          fi
          if [ "$SC_MIN_LIQ" != "$CE_MIN_LIQ" ]; then
            echo "::error::MINIMUM_LIQUIDITY mismatch: SmartContract=$SC_MIN_LIQ CoreEngine=$CE_MIN_LIQ"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "AMM constants have drifted between Smart Contract and Core Engine repos. Update src/pool/math.rs to match src/math.rs in Nodus-Protocol-Smart-Contract."
            exit 1
          fi
          echo "AMM constants verified in sync with Smart Contract."
      - name: Test
        run: cargo test --all-features

  idempotency-redis:
    name: idempotency suite (real Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run concurrency + crash suite against real Redis
        env:
          NODUS_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test --all-features --test idempotency_concurrency --test idempotency_crash
          cargo test --all-features --test idempotency_redis -- --ignored
      - name: Validate release promotion gate
        run: |
          python3 -m unittest discover -s release/tests -v
          python3 -m json.tool release/config/promotion-policy.json >/dev/null
          python3 -m json.tool release/examples/capacity-report.json >/dev/null
          python3 -m json.tool release/examples/promotion-evidence.json >/dev/null
          bash -n release/scripts/run-capacity.sh
          bash -n release/scripts/run-fault.sh
          bash -n release/scripts/create-manifest.sh
          bash -n release/scripts/run-canary.sh
          bash -n release/scripts/setup-proxies.sh
      - name: Build
        run: cargo build --release
